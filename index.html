    <style>
      html.boot-dashboard,
      html.boot-dashboard body {
        background-color: #0B1B2B;
        min-height: 100%;
        margin: 0;
      }

      html.boot-dashboard #app {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .app-boot {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
      }

      .app-boot__ring {
        width: 48px;
        height: 48px;
        border: 4px solid rgba(176, 141, 87, 0.2);
        border-top-color: #B08D57;
        border-radius: 50%;
        animation: app-boot-spin 0.9s linear infinite;
      }

      .app-boot__text {
        font-family: 'Inter', sans-serif;
        font-size: 14px;
        font-weight: 500;
        line-height: 1;
        color: #FFFCFF;
        opacity: 0.85;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      @keyframes app-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
      (function () {
        if (!location.pathname.includes('/dashboard')) return
        document.documentElement.classList.add('boot-dashboard')
        var app = document.getElementById('app')
        app.innerHTML =
          '<div class="app-boot" role="status" aria-label="Carregando">' +
          '<div class="app-boot__ring" aria-hidden="true"></div>' +
          '<span class="app-boot__text">Carregando...</span></div>'
      })()
    </script>
